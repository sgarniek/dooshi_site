<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dooshi — איפוס סיסמה</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    body {
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .reset-card {
      background: var(--warm-white);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius);
      padding: 2.75rem 2.5rem;
      width: 100%;
      max-width: 380px;
    }
    .reset-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--navy);
      text-align: center;
      margin-bottom: 0.2rem;
    }
    .reset-tagline {
      font-size: 0.65rem;
      color: var(--gold);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      text-align: center;
      border-top: 1px solid var(--gold-border);
      border-bottom: 1px solid var(--gold-border);
      padding: 4px 0;
      margin-bottom: 2rem;
    }
    .reset-card h2 { font-size: 1.1rem; color: var(--navy); margin-bottom: 0.4rem; font-weight: 600; }
    .reset-card > p { font-size: 0.83rem; color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.6; }
    .msg {
      padding: 9px 14px;
      border-radius: var(--radius);
      font-size: 0.82rem;
      margin-bottom: 1rem;
      line-height: 1.5;
    }
    .msg.error   { background: var(--rose-light); color: var(--rose); border: 1px solid var(--rose); }
    .msg.success { background: var(--sage-light);  color: var(--sage); border: 1px solid var(--sage); }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="reset-logo">Dooshi</div>
    <div class="reset-tagline">איפוס סיסמה</div>

    <!-- מצב: מאמת טוקן -->
    <div id="stateVerifying">
      <p style="text-align:center; color:var(--text-muted); font-size:0.9rem;">מאמת קישור...</p>
    </div>

    <!-- מצב: טופס סיסמה חדשה -->
    <div id="stateForm" style="display:none">
      <h2>הגדרת סיסמה חדשה</h2>
      <p>הסיסמה חייבת להכיל לפחות 6 תווים</p>

      <div id="formMsg" style="display:none" class="msg"></div>

      <div class="form-group">
        <label>סיסמה חדשה</label>
        <input type="password" id="newPassword" placeholder="••••••••"
               onkeydown="if(event.key==='Enter') doReset()" />
      </div>
      <div class="form-group">
        <label>אישור סיסמה</label>
        <input type="password" id="confirmPassword" placeholder="••••••••"
               onkeydown="if(event.key==='Enter') doReset()" />
      </div>

      <button class="btn btn-primary" id="resetBtn"
              style="width:100%; justify-content:center; padding:11px; margin-top:0.5rem;"
              onclick="doReset()">שמור סיסמה</button>
    </div>

    <!-- מצב: קישור פג תוקף -->
    <div id="stateExpired" style="display:none">
      <div class="msg error">הקישור אינו תקף או פג תוקפו.</div>
      <a href="/"
         style="display:block; text-align:center; font-size:0.82rem; color:var(--gold); margin-top:0.75rem;">
        ← חזרה לחנות
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://dqqrlthiinoyqirzfvrb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_H3SunmJ5mvMOvDfJSFdTBw_U4dt5I1I';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let customerId = null;

    function show(stateId) {
      ['stateVerifying', 'stateForm', 'stateExpired'].forEach(id => {
        document.getElementById(id).style.display = id === stateId ? '' : 'none';
      });
    }

    async function hashPassword(password, salt) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password + salt);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    function generateSalt() {
      const arr = new Uint8Array(16);
      crypto.getRandomValues(arr);
      return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function init() {
      const token = new URLSearchParams(window.location.search).get('token');

      if (!token) { show('stateExpired'); return; }

      const { data, error } = await db.from('password_resets')
        .select('customer_id, expires_at')
        .eq('token', token)
        .single();

      if (error || !data) { show('stateExpired'); return; }

      if (new Date(data.expires_at) < new Date()) { show('stateExpired'); return; }

      customerId = data.customer_id;
      show('stateForm');
      document.getElementById('newPassword').focus();
    }

    async function doReset() {
      const password = document.getElementById('newPassword').value;
      const confirm  = document.getElementById('confirmPassword').value;
      const msgEl    = document.getElementById('formMsg');
      const btn      = document.getElementById('resetBtn');

      const showMsg = (text, type) => {
        msgEl.textContent = text;
        msgEl.className = 'msg ' + type;
        msgEl.style.display = 'block';
      };

      msgEl.style.display = 'none';

      if (password.length < 6) { showMsg('הסיסמה חייבת להכיל לפחות 6 תווים', 'error'); return; }
      if (password !== confirm) { showMsg('הסיסמאות אינן תואמות', 'error'); return; }

      btn.textContent = '...';
      btn.disabled = true;

      const salt         = generateSalt();
      const passwordHash = await hashPassword(password, salt);

      const { error } = await db.from('customers')
        .update({ password_hash: passwordHash, salt })
        .eq('id', customerId);

      if (error) { showMsg('שגיאה: ' + error.message, 'error'); btn.textContent = 'שמור סיסמה'; btn.disabled = false; return; }

      // מחיקת הטוקן לאחר שימוש
      await db.from('password_resets').delete().eq('customer_id', customerId);

      showMsg('הסיסמה עודכנה בהצלחה! מעביר...', 'success');
      setTimeout(() => { window.location.href = '/'; }, 1500);
    }

    init();
  </script>
</body>
</html>
